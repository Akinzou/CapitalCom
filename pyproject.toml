[project]
name = "capitalcom"
version = "2.0.0.dev0"
description = "Client for Capital.com REST API (demo and real)"
authors = [{name = "Wikto Jelen", email = "wiktor.dev@yelon.ovh"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC BY-NC 4.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# 2.32.0 fixed Session.verify=False persisting across requests to the same host.
dependencies = ["requests>=2.32.3"]

[project.optional-dependencies]
encryption = ["cryptography>=42"]

[project.urls]
homepage = "https://github.com/Akinzou/CapitalCom"
discord = "https://discord.gg/BARYa55KS8"

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capitalcom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract' --strict-markers"
markers = ["contract: hits the real Capital.com demo API"]
