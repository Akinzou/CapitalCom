[project]
name = "capitalcom"
version = "2.0.0.dev0"
description = "Client for Capital.com REST API (demo and real)"
authors = [{name = "Wiktor Jeleń", email = "wiktor.dev@yelon.ovh"}]
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSE-ADDITIONAL-PERMISSION"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
# 2.32.4 is the first release without CVE-2024-35195 (verify=False sticking to a connection)
# and CVE-2024-47081 (.netrc credentials sent to the wrong host).
dependencies = ["requests>=2.32.4"]

[project.optional-dependencies]
# 44.0.1 is the first release without CVE-2024-26130 and CVE-2024-12797.
encryption = ["cryptography>=44.0.1"]

[project.urls]
homepage = "https://github.com/Akinzou/CapitalCom"
discord = "https://discord.gg/BARYa55KS8"

[dependency-groups]
dev = [
    "build>=1.2",
    # The encryption extra, so its code is type-checked and tested in every CI job.
    "cryptography>=44.0.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capitalcom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract' --strict-markers"
markers = ["contract: hits the real Capital.com demo API"]
# The legacy suite calls CapitalClient on purpose; tests that check the warning use
# pytest.warns, which records it regardless of this filter.
filterwarnings = ["ignore:CapitalClient:DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "DTZ", "T20", "BLE", "PT", "A",
    "C4", "RET", "PTH", "ANN",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
# The package root re-exports the legacy module's __all__ with a star import (F403), and the
# 2.x names without an __all__ of its own, so nothing a 1.x star import got is hidden (F401).
"src/capitalcom/__init__.py" = ["F401", "F403"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
