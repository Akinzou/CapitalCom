name: Documentation site

# Publishes the site on every push to master, so the site and the README's coverage badge
# follow master (ADR 0013). publish.yml calls it again after a release's PyPI upload, and it
# can be started by hand. The home page says the site follows master, and the changelog's
# Unreleased section names what is not on PyPI yet.
on:
  push:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling a half-finished upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds without write access: only the deploy job, which runs no third-party build code,
  # may write to Pages or mint an OIDC token.
  build:
    # A manual run from a feature branch would publish unreviewed pages.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group docs --group dev
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      # The README's coverage badge reads this file. Measured here, on the code being
      # published, rather than typed into the README, where the number would go stale; only the
      # total is published, not the per-file report (ADR 0013). CI already gated this code, so
      # a failure here is a flake: it must not hold back the site, and the gate is off.
      - name: Coverage for the README badge
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pytest --cov=capitalcom --cov-report=json:coverage.json --cov-fail-under=0 -q
          mkdir -p site/badges
          python -c "import json; t = json.load(open('coverage.json'))['totals']; json.dump({'percent_covered_display': t['percent_covered_display']}, open('site/badges/coverage.json', 'w'))"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The environment's deployment rules must allow master and v* tags (owner's setup).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
