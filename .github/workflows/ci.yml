name: CI

on:
  pull_request:
  push:
    branches: [master]

# No job here needs write access or secrets, so fork PRs run every gate unchanged.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Non-editable install: tests import the built package from site-packages, so a module
      # left out of the wheel fails here instead of shipping (ADR 0002).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . --group dev
      - run: pytest --cov=capitalcom --cov-report=term-missing

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install semgrep==1.185.0
      # Semgrep reports ERROR/WARNING/INFO only; ERROR stands for critical/high and blocks
      # the merge (ADR 0002).
      - name: Blocking scan (ERROR)
        run: >
          semgrep scan --config p/python --config p/security-audit --config p/secrets
          --severity ERROR --error --metrics=off .
      # WARNING findings do not block; the author copies them into the PR description with a
      # fix-or-accept decision. A scanner error still marks this step failed, so a broken
      # report is visible instead of looking like "no findings".
      - name: Report scan (WARNING)
        continue-on-error: true
        run: |
          set +e
          semgrep scan --config p/python --config p/security-audit --config p/secrets \
            --severity WARNING --metrics=off . > semgrep-warnings.txt
          rc=$?
          { echo '## Semgrep WARNING findings'; echo '```'; cat semgrep-warnings.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      # Installs the wheel into a clean venv and imports it from outside the checkout, so a
      # packaging mistake cannot be hidden by the source tree on sys.path.
      - name: Clean-install smoke test
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I -c "from capitalcom import CapitalClient; from capitalcom.client import CapitalClient"
